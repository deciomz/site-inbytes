# Só ativar depois de carregar ficheiros e executar nginx -t.
# Configuração inicial HTTP: o HTTPS será adicionado com Certbot numa etapa posterior.
server {
    listen 80;
    listen [::]:80;
    server_name inbytes.co.mz www.inbytes.co.mz;
    root /var/www/inbytes.co.mz/public;
    index index.html;
    client_max_body_size 16k;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /api/contact {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 40s;
    }
    location = /api/contact-config {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
